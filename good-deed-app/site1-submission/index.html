<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ส่งบันทึกความดี</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Sarabun', 'sans-serif'] },
      colors: { scout: { 50:'#f0f9ff',100:'#e0f2fe',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' } }
    } }
  }
</script>
<style>
  body { font-family: 'Sarabun', sans-serif; }
</style>
</head>
<body class="h-full">

  <header class="bg-scout-900 text-white px-5 py-4 shadow-sm">
    <div class="max-w-xl mx-auto flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-amber-500 text-scout-900 flex items-center justify-center font-extrabold text-lg shadow">B</div>
      <div>
        <h1 class="font-bold text-base leading-snug">ส่งบันทึกความดี</h1>
        <p class="text-xs text-scout-200">แบบฟอร์มบันทึกความดีออนไลน์</p>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-6">
      <h2 class="text-base font-bold text-slate-800 mb-1 flex items-center gap-2">
        <i class="fa-solid fa-file-circle-plus text-scout-600"></i> ส่งผลงานความดี
      </h2>
      <p class="text-xs text-slate-500 mb-5">กรุณากรอกข้อมูลและอัปโหลดภาพถ่าย 3-5 ภาพเพื่อส่งตรวจสอบ</p>

      <form id="site1-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">1. ชื่อ-นามสกุล <span class="text-rose-500">*</span></label>
          <input type="text" id="s1-name" required placeholder="เช่น ด.ช. สุรชัย ชัยเจริญ"
            class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-scout-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">2. ชื่อกิจกรรมที่ทำ <span class="text-rose-500">*</span></label>
          <input type="text" id="s1-title" required placeholder="เช่น ช่วยเหลือจราจรหน้าโรงเรียน"
            class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-scout-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">3. วันที่ทำกิจกรรม <span class="text-rose-500">*</span></label>
          <input type="date" id="s1-date" required
            class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-scout-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">4. รายละเอียดสั้นๆ <span class="text-rose-500">*</span></label>
          <textarea id="s1-desc" rows="3" required placeholder="อธิบายกิจกรรมที่ทำและผลลัพธ์ที่เกิดขึ้น..."
            class="w-full text-sm p-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-scout-600 outline-none"></textarea>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-slate-700">5. ภาพประกอบ <span class="text-rose-500">* (บังคับ 3-5 ภาพ)</span></label>
            <span id="s1-img-count" class="text-xs px-2 py-0.5 rounded-full bg-slate-100 font-medium text-slate-600">0 / 5 ภาพ</span>
          </div>
          <div id="s1-dropzone" class="border-2 border-dashed border-slate-300 hover:border-scout-600 bg-slate-50 rounded-xl p-4 text-center cursor-pointer transition-colors">
            <input type="file" id="s1-img-input" multiple accept="image/*" class="hidden">
            <i class="fa-solid fa-images text-2xl text-scout-600 mb-1"></i>
            <p class="text-xs font-medium text-slate-700">คลิกเพื่อเลือกรูปภาพ (เลือก 3-5 ภาพ)</p>
          </div>
          <p id="s1-img-error" class="text-xs text-rose-500 mt-1 hidden font-medium">
            <i class="fa-solid fa-circle-exclamation mr-1"></i> ต้องเลือกภาพอย่างน้อย 3 ภาพ และไม่เกิน 5 ภาพ
          </p>
          <div id="s1-preview-grid" class="grid grid-cols-5 gap-2 mt-3 hidden"></div>
        </div>
        <div class="pt-2">
          <button type="submit" id="s1-submit-btn" class="w-full py-2.5 rounded-lg bg-scout-600 hover:bg-scout-700 text-white font-semibold text-sm shadow-md transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> ส่งบันทึกความดี
          </button>
        </div>
      </form>
    </div>
  </main>

  <div id="toast" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 border border-slate-700">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-text">ทำรายการสำเร็จ</span>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
