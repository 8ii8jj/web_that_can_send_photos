<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-100">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตรวจสอบความดี (ผู้ดูแล)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Sarabun', 'sans-serif'] },
      colors: { scout: { 50:'#f0f9ff',100:'#e0f2fe',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' } }
    } }
  }
</script>
<style>
  body { font-family: 'Sarabun', sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 5px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="h-full">

  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-slate-200 p-6">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-10 h-10 rounded-lg bg-purple-600 text-white flex items-center justify-center font-bold text-base shadow">B</div>
        <div>
          <h1 class="font-bold text-slate-800 leading-snug">Verification Portal</h1>
          <p class="text-xs text-slate-500">เข้าสู่ระบบสำหรับผู้ดูแล</p>
        </div>
      </div>
      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมล</label>
          <input type="email" id="admin-email" required class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-scout-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
          <input type="password" id="admin-password" required class="w-full text-sm px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-scout-600 outline-none">
        </div>
        <p id="login-error" class="text-xs text-rose-500 hidden"></p>
        <button type="submit" class="w-full py-2.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-semibold text-sm shadow-md">
          เข้าสู่ระบบ
        </button>
      </form>
      <p class="text-[11px] text-slate-400 mt-4">บัญชีผู้ดูแลถูกสร้างไว้ล่วงหน้าใน Firebase Console เท่านั้น ไม่มีการสมัครสมาชิกด้วยตนเอง</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden h-screen flex flex-col">
    <div class="bg-slate-900 text-white px-5 py-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-purple-600 text-white flex items-center justify-center font-bold text-base shadow">B</div>
        <div>
          <h2 class="font-bold text-base leading-snug">Verification Portal</h2>
          <p class="text-xs text-slate-400">ระบบตรวจสอบและอนุมัติความดี</p>
        </div>
      </div>
      <div class="flex items-center gap-3 text-xs text-slate-300">
        <span id="admin-email-label"></span>
        <button id="logout-btn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700">
          <i class="fa-solid fa-right-from-bracket mr-1"></i>ออกจากระบบ
        </button>
      </div>
    </div>

    <div class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-1.5 text-xs overflow-x-auto shrink-0">
      <button data-filter="pending" onclick="setFilter('pending')" class="filter-btn px-3 py-1.5 rounded-lg font-semibold bg-scout-600 text-white">
        รอตรวจสอบ (<span id="cnt-pending">0</span>)
      </button>
      <button data-filter="approved" onclick="setFilter('approved')" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100">
        อนุมัติแล้ว (<span id="cnt-approved">0</span>)
      </button>
      <button data-filter="rejected" onclick="setFilter('rejected')" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100">
        ไม่อนุมัติ (<span id="cnt-rejected">0</span>)
      </button>
      <button data-filter="all" onclick="setFilter('all')" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-600 hover:bg-slate-100">
        ทั้งหมด (<span id="cnt-all">0</span>)
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 custom-scrollbar bg-slate-100">
      <div id="items-container" class="space-y-4 max-w-3xl mx-auto"></div>
      <div id="empty-state" class="hidden text-center py-12 bg-white rounded-xl border border-dashed border-slate-300 max-w-3xl mx-auto">
        <i class="fa-solid fa-inbox text-3xl text-slate-300 mb-2"></i>
        <p class="text-xs font-semibold text-slate-600">ไม่มีรายการในหมวดหมู่นี้</p>
      </div>
    </div>
  </div>

  <!-- Image Modal -->
  <div id="img-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4" onclick="closeImgModal()">
    <div class="relative max-w-3xl max-h-[85vh] w-full bg-slate-900 rounded-2xl overflow-hidden shadow-2xl flex flex-col" onclick="event.stopPropagation()">
      <div class="p-2 bg-black flex-1 flex items-center justify-center overflow-hidden">
        <img id="modal-img" src="" class="max-h-[75vh] object-contain rounded">
      </div>
      <button onclick="closeImgModal()" class="absolute top-3 right-3 w-7 h-7 rounded-full bg-slate-700 text-white flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
